<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knotly Widget Preview — Embeddable Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .typing-dot { animation: blink 1.4s infinite both; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }
        .stream-cursor { animation: cursor-blink 0.8s infinite; }
        @keyframes cursor-blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        .chat-enter { animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .bubble-bounce { animation: bounce-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes bounce-in { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-8">

    <!-- Simulated website background -->
    <div class="absolute inset-0 bg-gradient-to-br from-gray-800 to-gray-900 opacity-50"></div>
    <div class="absolute top-8 left-8 text-white/40 text-sm">
        Simulated customer website — widget appears bottom-right
    </div>

    <!-- The Widget -->
    <div class="fixed bottom-6 right-6 z-50">
        <!-- Chat Window -->
        <div id="chat-window" class="hidden mb-4 w-[380px] h-[560px] bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col chat-enter">
            <!-- Header -->
            <div class="bg-gradient-to-r from-indigo-600 to-indigo-500 px-5 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm0 14.5a6.5 6.5 0 110-13 6.5 6.5 0 010 13z"/><path d="M10 6a1 1 0 011 1v3.586l2.207 2.207a1 1 0 01-1.414 1.414l-2.5-2.5A1 1 0 019 11V7a1 1 0 011-1z"/></svg>
                    </div>
                    <div>
                        <div class="text-white font-semibold text-sm">Support Agent</div>
                        <div class="text-white/70 text-xs flex items-center gap-1">
                            <span class="w-1.5 h-1.5 bg-green-400 rounded-full"></span>
                            Online
                        </div>
                    </div>
                </div>
                <button onclick="toggleChat()" class="text-white/70 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
            </div>

            <!-- Messages -->
            <div id="messages" class="flex-1 overflow-auto p-4 space-y-4 bg-[#fafafa]">
                <!-- Welcome message -->
                <div class="chat-enter">
                    <div class="flex items-start gap-2">
                        <div class="w-7 h-7 bg-indigo-100 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                            <svg class="w-3.5 h-3.5 text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16z"/></svg>
                        </div>
                        <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm max-w-[85%]">
                            <p class="text-sm text-gray-800">Hi! I'm here to help. Ask me anything about our product, pricing, or features.</p>
                        </div>
                    </div>
                </div>

                <!-- Suggested questions -->
                <div class="flex flex-wrap gap-2 pl-9">
                    <button onclick="sendSuggested('How do I reset my password?')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-xs text-gray-600 hover:border-indigo-300 hover:text-indigo-600 transition-colors">
                        Reset password
                    </button>
                    <button onclick="sendSuggested('What are your pricing plans?')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-xs text-gray-600 hover:border-indigo-300 hover:text-indigo-600 transition-colors">
                        Pricing plans
                    </button>
                    <button onclick="sendSuggested('How to connect Stripe?')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-xs text-gray-600 hover:border-indigo-300 hover:text-indigo-600 transition-colors">
                        Connect Stripe
                    </button>
                </div>
            </div>

            <!-- Input -->
            <div class="p-4 border-t border-gray-100 bg-white">
                <div class="flex gap-2">
                    <input id="chat-input" type="text" placeholder="Ask a question..."
                        class="flex-1 px-4 py-2.5 bg-[#f5f5f5] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 transition-all"
                        onkeypress="if(event.key==='Enter')sendMessage()">
                    <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition-all active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    </button>
                </div>
                <div class="text-center mt-2">
                    <span class="text-[10px] text-gray-300">Powered by Knotly</span>
                </div>
            </div>
        </div>

        <!-- Bubble -->
        <button id="chat-bubble" onclick="toggleChat()" class="w-14 h-14 bg-indigo-600 hover:bg-indigo-700 rounded-full shadow-lg flex items-center justify-center transition-all active:scale-90 bubble-bounce">
            <svg id="bubble-icon-open" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            <svg id="bubble-icon-close" class="w-6 h-6 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            <!-- Unread indicator -->
            <span id="unread-dot" class="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-white hidden"></span>
        </button>
    </div>

    <script>
    let chatOpen = false;
    const responses = {
        'how do i reset my password?': {
            text: 'To reset your password:\n\n1. Go to **Settings → Security**\n2. Click "Reset Password"\n3. Enter your current password\n4. Set your new password (min 8 characters)\n5. Click "Save Changes"\n\nYou\'ll receive a confirmation email.',
            source: 'Product Documentation v2.4 — Section: Account Security',
            confidence: 0.94
        },
        'what are your pricing plans?': {
            text: 'We offer three plans:\n\n• **Starter** ($29/mo) — 2,000 messages, 1 chatbot, 50MB storage\n• **Pro** ($99/mo) — 10,000 messages, unlimited chatbots, 500MB storage\n• **Business** ($299/mo) — 50,000 messages, white-label, SSO, priority support\n\nAll plans include hybrid search, citations, and human escalation. No branding fees.',
            source: 'Pricing Page — Last updated May 2026',
            confidence: 0.98
        },
        'how to connect stripe?': {
            text: 'To connect your Stripe account:\n\n1. Navigate to **Settings → Integrations**\n2. Find "Stripe" and click **Connect**\n3. Authorize in the Stripe popup window\n4. Select which products/prices to sync\n5. Your account will sync within 30 seconds\n\nOnce connected, your chatbot can answer billing questions and show order status.',
            source: 'Integration Guide — Stripe Setup (page 12)',
            confidence: 0.91
        }
    };

    function toggleChat() {
        chatOpen = !chatOpen;
        document.getElementById('chat-window').classList.toggle('hidden', !chatOpen);
        document.getElementById('bubble-icon-open').classList.toggle('hidden', chatOpen);
        document.getElementById('bubble-icon-close').classList.toggle('hidden', !chatOpen);
        document.getElementById('unread-dot').classList.add('hidden');
        if (chatOpen) document.getElementById('chat-input').focus();
    }

    function sendSuggested(text) {
        document.getElementById('chat-input').value = text;
        sendMessage();
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';

        // Add user message
        addMessage(text, 'user');

        // Show typing indicator
        setTimeout(() => {
            addTyping();
            // Simulate streaming response
            setTimeout(() => {
                removeTyping();
                const key = text.toLowerCase();
                const response = responses[key] || {
                    text: "I found some relevant information, but I'm not fully confident in my answer. Would you like me to connect you with a human agent who can help?",
                    source: null,
                    confidence: 0.45
                };
                streamResponse(response);
            }, 1200);
        }, 400);
    }

    function addMessage(text, role) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'chat-enter';

        if (role === 'user') {
            div.innerHTML = `
                <div class="flex justify-end">
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 max-w-[85%]">
                        <p class="text-sm">${text}</p>
                    </div>
                </div>`;
        }
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function addTyping() {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.id = 'typing-indicator';
        div.className = 'chat-enter';
        div.innerHTML = `
            <div class="flex items-start gap-2">
                <div class="w-7 h-7 bg-indigo-100 rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-3.5 h-3.5 text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16z"/></svg>
                </div>
                <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm">
                    <div class="flex gap-1">
                        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                    </div>
                </div>
            </div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function removeTyping() {
        document.getElementById('typing-indicator')?.remove();
    }

    function streamResponse(response) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'chat-enter';

        const confidenceColor = response.confidence > 0.8 ? 'green' : response.confidence > 0.6 ? 'yellow' : 'red';
        const confidenceLabel = response.confidence > 0.8 ? 'High confidence' : response.confidence > 0.6 ? 'Medium confidence' : 'Low confidence';

        let sourceHtml = '';
        if (response.source) {
            sourceHtml = `
                <div class="mt-3 pt-2 border-t border-gray-100">
                    <div class="flex items-center gap-1.5 text-[11px] text-gray-400">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        <span>${response.source}</span>
                    </div>
                </div>`;
        }

        let confidenceHtml = `
            <div class="flex items-center gap-1.5 mt-2">
                <div class="w-1.5 h-1.5 rounded-full bg-${confidenceColor}-500"></div>
                <span class="text-[10px] text-gray-400">${confidenceLabel} (${Math.round(response.confidence * 100)}%)</span>
            </div>`;

        // Format text with basic markdown (bold)
        const formattedText = response.text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');

        div.innerHTML = `
            <div class="flex items-start gap-2">
                <div class="w-7 h-7 bg-indigo-100 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                    <svg class="w-3.5 h-3.5 text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16z"/></svg>
                </div>
                <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm max-w-[85%]">
                    <p class="text-sm text-gray-800 leading-relaxed">${formattedText}</p>
                    ${sourceHtml}
                    ${confidenceHtml}
                </div>
            </div>`;

        container.appendChild(div);
        container.scrollTop = container.scrollHeight;

        // If low confidence, offer escalation
        if (response.confidence < 0.6) {
            setTimeout(() => {
                const escalation = document.createElement('div');
                escalation.className = 'chat-enter pl-9';
                escalation.innerHTML = `
                    <button class="px-4 py-2 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-700 hover:bg-amber-100 transition-colors">
                        Connect me to a human agent
                    </button>`;
                container.appendChild(escalation);
                container.scrollTop = container.scrollHeight;
            }, 600);
        }
    }

    // Auto-open after 2 seconds for demo
    setTimeout(() => {
        document.getElementById('unread-dot').classList.remove('hidden');
    }, 2000);
    </script>
</body>
</html>
